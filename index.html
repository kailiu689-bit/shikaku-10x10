<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4e9">
<meta name="description" content="320 道可在手机上玩的 10×10 数方。用数字和矩形填满棋盘。">
<title>数方｜10×10 逻辑游戏</title>
<style>
:root {
  color-scheme: light;
  --paper: #f6f4e9;
  --tile: #fffdf4;
  --ink: #202921;
  --muted: #555d50;
  --line: #cdd0be;
  --accent: #d9ef84;
  --green: #33492d;
  --heading: "Bricolage Grotesque", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --text: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
}
* { box-sizing: border-box }
body { margin: 0; color: var(--ink); font: 15px/1.5 var(--text); background: var(--paper); }
button, input { font: inherit; color: inherit; }
button {
  appearance: none; background: var(--tile); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 14px; min-height: 44px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; font-weight: 650;
}
button:hover:not(:disabled) { border-color: var(--green); }
:focus-visible { outline: 3px solid #4c7838; outline-offset: 3px; }
button:disabled { opacity: .42; cursor: default; }
button.primary { background: var(--accent); border-color: var(--green); }
button.dark { background: var(--ink); color: white; border-color: var(--ink); }
[hidden] { display: none !important; }
.shell { width: min(100% - 48px, 1000px); margin-inline: auto; }
.site-header {
  height: 70px; display: flex; gap: 16px; align-items: center;
  justify-content: space-between; border-bottom: 1px solid var(--line);
}
.brand { display: inline-flex; align-items: center; gap: 12px; font: 800 21px/1 var(--heading); letter-spacing: .055em; }
.mark { width: 31px; height: 31px; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; padding: 4px; border: 1.5px solid var(--ink); border-radius: 7px; }
.mark i { background: var(--ink); border-radius: 2px; }
.mark i:first-child { grid-row: span 2; background: #9ab342; }
.total { font: 12px var(--mono); color: var(--muted); }
.layout { display: grid; grid-template-columns: minmax(0, 570px) minmax(235px, 1fr); gap: clamp(25px, 5vw, 70px); align-items: start; padding: 32px 0 46px; }
.game-top { display: flex; align-items: end; justify-content: space-between; gap: 8px; margin-bottom: 13px; }
.level-label { display: flex; align-items: center; gap: 10px; min-width: 0; }
h1 { font: 800 clamp(28px, 4.1vw, 46px)/1.12 var(--heading); margin: 0; letter-spacing: -.065em; white-space: nowrap; }
h1 span { font-variant-numeric: tabular-nums; }
.badge { border: 1px solid #acbd6d; background: #e9f2c8; padding: 3px 8px; border-radius: 5px; color: #385125; font-size: 12px; font-weight: 750; white-space: nowrap; }
#choose { white-space: nowrap; }
.meter-row { display: flex; gap: 10px; align-items: center; margin-bottom: 11px; color: var(--muted); font-size: 12px; }
progress { flex: 1; height: 5px; appearance: none; border: 0; border-radius: 8px; overflow: hidden; color: #7e9d39; background: #dce0cd; }
progress::-webkit-progress-bar { background: #dce0cd; }
progress::-webkit-progress-value { background: #7e9d39; transition: width .2s; }
progress::-moz-progress-bar { background: #7e9d39; }
#coverage { min-width: 68px; text-align: right; font-variant-numeric: tabular-nums; }
.board {
  position: relative; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr));
  aspect-ratio: 1; width: 100%; border: 2px solid var(--ink); border-radius: 10px;
  overflow: hidden; background: var(--tile); touch-action: none; user-select: none;
  -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  box-shadow: 0 4px 0 #d9d9ca; cursor: crosshair;
}
.cell {
  position: relative; display: grid; place-items: center; min-height: 0; min-width: 0;
  padding: 0; background: transparent; border: 0; border-radius: 0;
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  font: 750 clamp(13px, 4.7vw, 24px)/1 var(--mono); cursor: inherit;
}
.cell:nth-child(10n) { border-right-color: transparent; }
.cell:nth-last-child(-n+10) { border-bottom-color: transparent; }
.cell > span { z-index: 3; pointer-events: none; }
.cell:focus-visible { outline-offset: -3px; z-index: 4; }
.rect {
  position: absolute; pointer-events: none; z-index: 1; border: 2px solid var(--edge);
  border-radius: 4px; background: var(--fill); opacity: .88;
}
.preview { z-index: 2; border-color: #37591c; background: #d8ec83; }
.preview.invalid { border-color: #9e4034; background: #ffdacd; }
.preview.anchor { outline: 1px dashed #405825; outline-offset: -5px; }
.status { margin: 10px 0 9px; min-height: 24px; font-size: 13px; color: var(--muted); }
.status[data-kind="error"] { color: #942f26; }
.status[data-kind="success"] { color: #365b25; font-weight: 750; }
.tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tools button { padding-inline: 3px; white-space: nowrap; }
.tools svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.advance { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.advance > button { flex: 1; }
.side { margin-top: 2px; padding-top: 6px; }
.kicker { color: var(--green); font: 750 12px var(--mono); letter-spacing: .12em; margin: 0 0 10px; }
.side h2 { font: 800 clamp(25px, 3vw, 34px)/1.2 var(--heading); margin: 0 0 20px; }
.rules { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.rules li { display: flex; align-items: center; gap: 13px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.rules li span { flex: 0 0 24px; height: 24px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--mono); }
.example { display: flex; align-items: center; gap: 13px; background: #e8eadb; border-radius: 10px; padding: 12px; margin: 17px 0 0; font-size: 13px; }
.mini-grid {
  display: flex; padding-left: 4px; align-items: center; flex: 0 0 44px; height: 30px;
  border: 1.5px solid #4d6630; border-radius: 3px; font: 750 12px var(--mono);
  background: linear-gradient(transparent 47%, #adb97d 48%, #adb97d 52%, transparent 53%) center / 100% 100%, repeating-linear-gradient(90deg, transparent 0 13px, #adb97d 13px 14px) #e1eea9;
}
dialog {
  width: min(100% - 24px, 510px); max-height: min(750px, 88vh); max-height: min(750px, 88dvh);
  margin: auto; padding: 20px; border: 1px solid var(--ink); border-radius: 15px;
  background: var(--paper); color: var(--ink); box-shadow: 0 16px 60px #18251844;
}
dialog::backdrop { background: #19241877; }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dialog-head h2 { margin: 0; font-size: 23px; line-height: 1.3; }
.dialog-head button { flex-shrink: 0; }
.jump { display: flex; align-items: center; gap: 8px; margin: 14px 0; }
.jump input { width: 90px; min-width: 65px; min-height: 44px; padding: 6px; background: var(--tile); border: 1px solid var(--line); border-radius: 8px; font-variant-numeric: tabular-nums; }
.tiers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; margin-bottom: 12px; }
.tiers button { padding-inline: 2px; }
.tiers button[aria-pressed="true"] { background: var(--accent); border-color: var(--green); }
.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(43px, 1fr)); gap: 5px; }
.levels button { padding: 3px; min-height: 43px; font: 650 13px var(--mono); }
.levels button.cleared { background: #e8edcf; }
.levels button[aria-current="true"] { border: 2px solid var(--green); background: var(--accent); }
.dialog-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
@media (max-width: 730px) {
  .shell { width: min(100% - 24px, 510px); }
  .site-header { height: 53px; }
  .brand { font-size: 18px; gap: 8px; }
  .mark { width: 26px; height: 26px; }
  .layout { display: block; padding-top: 16px; padding-bottom: max(28px, env(safe-area-inset-bottom)); }
  .game-top { margin-bottom: 8px; }
  .meter-row { margin-bottom: 8px; }
  .side { margin-top: 24px; }
  .side h2 { font-size: 23px; margin-bottom: 12px; }
  .rules li { padding: 9px 0; }
}
@media (max-width: 360px) {
  .level-label { gap: 6px; }
  .tools { gap: 4px; }
  .tools button { font-size: 13px; }
  .tools svg { margin-right: 2px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
  <header class="site-header shell">
    <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>数方</div>
    <span class="total" id="total">已通关 0 / 320</span>
  </header>
  <main class="layout shell">
    <section aria-labelledby="level-heading">
      <div class="game-top">
        <div class="level-label"><h1 id="level-heading">第 <span id="number">001</span> 关</h1><span class="badge" id="tier">入门</span></div>
        <button id="choose" type="button">选关</button>
      </div>
      <div class="meter-row">
        <span>覆盖格数</span>
        <progress id="progress" max="100" value="0" aria-label="已覆盖格数"></progress>
        <span id="coverage">0 / 100</span>
      </div>
      <div class="board" id="board" role="group" aria-labelledby="level-heading" aria-describedby="rules"></div>
      <p class="status" id="status" role="status">拖动圈出矩形，也可以轻点两个对角格。</p>
      <div class="tools">
        <button id="undo" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5 3 10l5 5M3 10h11a6 6 0 0 1 0 12"/></svg>撤销</button>
        <button id="reset" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7"/></svg>重来</button>
        <button id="hint" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18h6m-5 4h4M9 15v-1a6 6 0 1 1 6 0v1"/></svg>提示</button>
        <button id="check" class="primary" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>检查</button>
      </div>
      <div class="advance" id="advance" hidden>
        <button id="next" class="dark" type="button">下一关 →</button>
      </div>
    </section>
    <aside class="side" id="rules" aria-labelledby="rules-heading">
      <p class="kicker">10 × 10</p>
      <h2 id="rules-heading">怎么玩</h2>
      <ol class="rules">
        <li><span aria-hidden="true">1</span>拖动，或轻点两个对角格，圈出矩形。</li>
        <li><span aria-hidden="true">2</span>每个矩形只含一个数字，格数等于这个数字。</li>
        <li><span aria-hidden="true">3</span>矩形不能重叠，铺满 100 格就通关。</li>
      </ol>
      <p class="example"><span class="mini-grid" aria-hidden="true">6</span><span>数字 6 可以圈成 2×3，也可以圈成 1×6。</span></p>
    </aside>
  </main>

  <dialog id="picker" aria-labelledby="picker-title">
    <div class="dialog-head"><h2 id="picker-title">选关</h2><button id="close-picker" type="button">关闭</button></div>
    <form class="jump" id="jump"><label for="jump-input">关卡号</label><input id="jump-input" type="number" inputmode="numeric" min="1" max="320" step="1" required><button type="submit">前往</button></form>
    <div class="tiers" id="tiers" aria-label="难度"></div>
    <div class="levels" id="levels" aria-label="关卡"></div>
  </dialog>

  <dialog id="reset-dialog" aria-labelledby="reset-title">
    <div class="dialog-head"><h2 id="reset-title">重新挑战本关？</h2></div>
    <p>清空棋盘上的矩形，保留已通关记录。</p>
    <form class="dialog-actions" method="dialog"><button value="cancel" autofocus>取消</button><button value="reset" class="primary">清空棋盘</button></form>
  </dialog>

<script>
'use strict';
const puzzles = JSON.parse(document.getElementById('puzzles').textContent);
const names = ['入门', '进阶', '挑战', '大师'];
const palette = [
  ['#e1efa9', '#648133'], ['#cae6d9', '#4e8068'], ['#f6df9d', '#977733'],
  ['#d8e2f3', '#5e7597'], ['#f5d4c0', '#a56950'], ['#e7def1', '#806598'],
  ['#e9ded1', '#84674b'], ['#d3e8ad', '#5c813c']
];
const byId = id => document.getElementById(id);
const board = byId('board');
const picker = byId('picker');
const resetDialog = byId('reset-dialog');
const defaultStatus = '拖动圈出矩形，也可以轻点两个对角格。';
const storeKey = 'shikaku-10x10-v1';
const pads = n => String(n).padStart(3, '0');

function readSave() {
  const empty = { current: 0, cleared: [], boards: {} };
  try {
    const saved = JSON.parse(localStorage.getItem(storeKey));
    if (!saved || !Array.isArray(saved.cleared) || !saved.boards || typeof saved.boards !== 'object') return empty;
    return saved;
  } catch { return empty; }
}

const save = readSave();
const isLevel = n => Number.isInteger(n) && n >= 0 && n < puzzles.length;
const cleared = new Set(save.cleared.filter(isLevel));
let current = isLevel(save.current) ? save.current : 0;
let clueMap = new Map();
let solutions = [];
let regions = [];
let history = [];
let occupied = new Int16Array(100).fill(-1);
let anchor = null;
let preview = null;
let gesture = null;
let focusIndex = 0;
let inspection = new Set();
let finished = false;
const cells = Array.from({length: 100}, (_, i) => {
  const cell = document.createElement('button');
  cell.type = 'button';
  cell.className = 'cell';
  cell.dataset.index = i;
  cell.tabIndex = i === 0 ? 0 : -1;
  cell.append(document.createElement('span'));
  board.append(cell);
  return cell;
});

function corners(a, b) {
  const x = Math.min(a % 10, b % 10);
  const y = Math.min(Math.floor(a / 10), Math.floor(b / 10));
  const right = Math.max(a % 10, b % 10);
  const bottom = Math.max(Math.floor(a / 10), Math.floor(b / 10));
  return { a: y*10+x, b: bottom*10+right, x, y, w: right-x+1, h: bottom-y+1 };
}

function members({x, y, w, h}) {
  const result = [];
  for (let row = y; row < y+h; row++) {
    for (let col = x; col < x+w; col++) result.push(row*10+col);
  }
  return result;
}

function validate(rect) {
  const indices = members(rect);
  const clues = indices.filter(i => clueMap.has(i));
  if (indices.some(i => occupied[i] !== -1)) return { error: '这个矩形与已有矩形重叠。轻点已有矩形可以移除。' };
  if (clues.length !== 1) return { error: clues.length ? '每个矩形只能圈住一个数字。' : '这个矩形里面没有数字。' };
  const clue = clues[0];
  if (clueMap.get(clue) !== indices.length) return { error: `圈了 ${indices.length} 格，数字 ${clueMap.get(clue)} 需要同样多的格数。` };
  return { clue };
}

function saveBoard() {
  save.current = current;
  save.cleared = [...cleared];
  if (regions.length) save.boards[current] = regions.map(({a, b}) => [a, b]);
  else delete save.boards[current];
  try { localStorage.setItem(storeKey, JSON.stringify(save)); } catch {}
}

function showStatus(message = defaultStatus, kind = '') {
  const status = byId('status');
  status.textContent = message;
  status.dataset.kind = kind;
}

function updateFocus(index, move = false) {
  cells[focusIndex].tabIndex = -1;
  focusIndex = index;
  cells[index].tabIndex = 0;
  if (move) cells[index].focus({ preventScroll: true });
}

function drawRect(rect, className, colorIndex = 0) {
  const element = document.createElement('div');
  element.className = `rect ${className}`;
  element.setAttribute('aria-hidden', 'true');
  const [fill, edge] = palette[colorIndex % palette.length];
  Object.assign(element.style, {
    left: `calc(${rect.x*10}% + 1px)`, top: `calc(${rect.y*10}% + 1px)`,
    width: `calc(${rect.w*10}% - 2px)`, height: `calc(${rect.h*10}% - 2px)`
  });
  element.style.setProperty('--fill', fill);
  element.style.setProperty('--edge', edge);
  board.append(element);
  return element;
}

function drawPreview(rect, isAnchor = false) {
  preview?.remove();
  preview = null;
  if (rect) preview = drawRect(rect, `preview${isAnchor ? ' anchor' : validate(rect).error ? ' invalid' : ''}`);
}

function refresh() {
  board.querySelectorAll('.rect').forEach(element => element.remove());
  preview = null;
  occupied.fill(-1);
  let count = 0;
  regions.forEach((rect, index) => {
    const placement = drawRect(rect, '', (rect.clue * 5 + Math.floor(rect.clue / 10)) % palette.length);
    if (inspection.has(index)) {
      placement.style.setProperty('--fill', '#ffdace');
      placement.style.setProperty('--edge', '#aa3a31');
    }
    for (const i of members(rect)) { occupied[i] = index; count++; }
  });
  cells.forEach((cell, i) => {
    const clue = clueMap.get(i);
    cell.firstChild.textContent = clue ?? '';
    const label = `第 ${Math.floor(i/10)+1} 行第 ${i%10+1} 列`;
    cell.setAttribute('aria-label', `${label}${clue ? `，数字 ${clue}` : ''}${occupied[i] >= 0 ? '，已圈选' : ''}`);
  });
  if (anchor !== null) drawPreview(corners(anchor, anchor), true);
  finished = count === 100;
  if (finished) cleared.add(current);
  byId('progress').value = count;
  byId('coverage').textContent = `${count} / 100`;
  byId('number').textContent = pads(current + 1);
  byId('tier').textContent = names[Math.floor(current / 80)];
  byId('total').textContent = `已通关 ${cleared.size} / ${puzzles.length}`;
  byId('undo').disabled = !history.length;
  byId('reset').disabled = !regions.length;
  byId('hint').disabled = finished;
  byId('advance').hidden = !finished;
  byId('next').textContent = current + 1 === puzzles.length ? '返回选关' : '下一关 →';
  return count;
}

function loadLevel(index) {
  if (!isLevel(index)) return;
  current = index;
  clueMap = new Map();
  solutions = [];
  const code = puzzles[index];
  for (let offset = 0; offset < code.length; offset += 8) {
    const values = code.slice(offset, offset+8).match(/../g).map(value => parseInt(value, 36));
    const [clue, area, a, b] = values;
    clueMap.set(clue, area);
    solutions.push({ ...corners(a, b), clue });
  }
  regions = [];
  history = [];
  inspection = new Set();
  anchor = null;
  gesture = null;
  occupied.fill(-1);
  const previous = save.boards[index];
  if (Array.isArray(previous)) {
    for (const pair of previous) {
      if (!Array.isArray(pair) || pair.length !== 2 || !pair.every(i => Number.isInteger(i) && i >= 0 && i < 100)) continue;
      const rect = corners(...pair);
      const result = validate(rect);
      if (result.error) continue;
      for (const i of members(rect)) occupied[i] = regions.length;
      regions.push({ ...rect, clue: result.clue });
    }
  }
  updateFocus(0);
  refresh();
  saveBoard();
  showStatus(finished ? '通关！100 格已经全部填满。' : defaultStatus, finished ? 'success' : '');
}

function commit(next, message = defaultStatus) {
  history.push(regions);
  regions = next;
  anchor = null;
  inspection = new Set();
  refresh();
  saveBoard();
  showStatus(finished ? '通关！100 格已经全部填满。' : message, finished ? 'success' : '');
}

function place(rect) {
  anchor = null;
  drawPreview(null);
  const result = validate(rect);
  if (result.error) {
    showStatus(result.error, 'error');
    return;
  }
  commit([...regions, {...rect, clue: result.clue}], `已圈出 ${rect.w*rect.h} 格。`);
}

function selectCell(index) {
  if (finished) return;
  if (anchor !== null) {
    if (anchor === index) {
      anchor = null;
      drawPreview(null);
      showStatus();
    } else {
      place(corners(anchor, index));
    }
  } else if (occupied[index] >= 0) {
    commit(regions.filter((_, i) => i !== occupied[index]), '已移除这个矩形。');
  } else {
    anchor = index;
    drawPreview(corners(index, index), true);
    showStatus('现在轻点矩形的另一角。再次点同一格可取消。');
  }
}

function cellAt(event) {
  const bounds = board.getBoundingClientRect();
  const size = bounds.width - 2 * board.clientLeft;
  const clamp = value => Math.min(9, Math.max(0, Math.floor(value)));
  const x = clamp((event.clientX - bounds.left - board.clientLeft) * 10 / size);
  const y = clamp((event.clientY - bounds.top - board.clientTop) * 10 / size);
  return y * 10 + x;
}

board.addEventListener('pointerdown', event => {
  if (event.button !== 0 || !event.isPrimary || finished) return;
  const index = cellAt(event);
  gesture = { id: event.pointerId, start: index, x: event.clientX, y: event.clientY, moved: false };
  board.setPointerCapture(event.pointerId);
  if (event.cancelable) event.preventDefault();
});

board.addEventListener('pointermove', event => {
  if (gesture?.id !== event.pointerId) return;
  const index = cellAt(event);
  if (index !== gesture.start && Math.hypot(event.clientX-gesture.x, event.clientY-gesture.y) > 6) gesture.moved = true;
  if (gesture.moved) drawPreview(corners(gesture.start, index));
});

board.addEventListener('pointerup', event => {
  if (gesture?.id !== event.pointerId) return;
  const {start, moved} = gesture;
  const end = cellAt(event);
  gesture = null;
  updateFocus(end);
  if (moved || start !== end) place(corners(start, end));
  else selectCell(end);
});

function cancelGesture(event) {
  if (gesture?.id !== event.pointerId) return;
  gesture = null;
  drawPreview(anchor === null ? null : corners(anchor, anchor), true);
}
board.addEventListener('pointercancel', cancelGesture);
board.addEventListener('lostpointercapture', cancelGesture);
board.addEventListener('click', event => {
  const cell = event.target.closest('.cell');
  if (event.detail === 0 && cell) selectCell(Number(cell.dataset.index));
});
board.addEventListener('keydown', event => {
  const row = Math.floor(focusIndex / 10);
  const col = focusIndex % 10;
  const steps = {
    ArrowLeft: row*10+Math.max(0,col-1), ArrowRight: row*10+Math.min(9,col+1),
    ArrowUp: Math.max(0,row-1)*10+col, ArrowDown: Math.min(9,row+1)*10+col
  };
  if (Object.hasOwn(steps, event.key)) {
    event.preventDefault();
    updateFocus(steps[event.key], true);
  }
  if (event.key === 'Escape' && anchor !== null) {
    anchor = null;
    drawPreview(null);
    showStatus();
  }
});

byId('undo').addEventListener('click', () => {
  if (!history.length) return;
  regions = history.pop();
  anchor = null;
  inspection = new Set();
  refresh();
  saveBoard();
  showStatus('已撤销上一步。');
});
byId('reset').addEventListener('click', () => {
  resetDialog.returnValue = '';
  resetDialog.showModal();
});
resetDialog.addEventListener('close', () => {
  if (resetDialog.returnValue === 'reset') commit([], '本关已清空，可以重新开始。');
});
byId('hint').addEventListener('click', () => {
  const missing = solutions.filter(solution => !regions.some(r => r.a === solution.a && r.b === solution.b));
  if (!missing.length) return;
  const free = missing.find(solution => members(solution).every(i => occupied[i] === -1));
  const chosen = free ?? missing[0];
  const conflicts = new Set(members(chosen).map(i => occupied[i]).filter(index => index >= 0));
  commit([...regions.filter((_, index) => !conflicts.has(index)), chosen],
    conflicts.size ? `已填好一块，并移除 ${conflicts.size} 个与它重叠的矩形。` : '已帮你填好一块矩形。');
});
byId('check').addEventListener('click', () => {
  const correct = new Set(solutions.map(r => `${r.a}:${r.b}`));
  inspection = new Set(regions.flatMap((r, index) => correct.has(`${r.a}:${r.b}`) ? [] : [index]));
  const count = refresh();
  if (inspection.size) showStatus(`红色标出了需要调整的 ${inspection.size} 个矩形。`, 'error');
  else if (finished) showStatus('通关！100 格已经全部填满。', 'success');
  else if (count) showStatus(`已圈出的矩形都对，还剩 ${100-count} 格。`);
  else showStatus('先圈出一个矩形，再来检查。');
});

function showTier(index) {
  byId('tiers').querySelectorAll('button').forEach((button, i) => button.setAttribute('aria-pressed', i === index));
  const list = byId('levels');
  list.replaceChildren();
  for (let level = index * 80; level < Math.min(index*80+80, puzzles.length); level++) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = pads(level + 1);
    button.dataset.level = level;
    button.setAttribute('aria-label', `第 ${level+1} 关${cleared.has(level) ? '，已通关' : ''}`);
    if (level === current) button.setAttribute('aria-current', 'true');
    if (cleared.has(level)) button.classList.add('cleared');
    list.append(button);
  }
}

names.forEach((name, index) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = name;
  button.addEventListener('click', () => showTier(index));
  byId('tiers').append(button);
});
function openPicker() {
  showTier(Math.floor(current / 80));
  byId('jump-input').value = current + 1;
  picker.showModal();
}
function selectLevel(level) {
  if (!isLevel(level)) return;
  picker.close();
  loadLevel(level);
}
byId('choose').addEventListener('click', openPicker);
byId('close-picker').addEventListener('click', () => picker.close());
byId('levels').addEventListener('click', event => {
  const button = event.target.closest('[data-level]');
  if (button) selectLevel(Number(button.dataset.level));
});
byId('jump').addEventListener('submit', event => {
  event.preventDefault();
  selectLevel(byId('jump-input').valueAsNumber - 1);
});
byId('next').addEventListener('click', () => {
  if (current + 1 < puzzles.length) {
    loadLevel(current + 1);
    byId('choose').focus({ preventScroll: true });
  } else {
    openPicker();
  }
});

loadLevel(current);
</script>
</body>
</html>
